nt-weight="bold" text-anchor="middle">handle：句柄计数 + 租约 120 s</text><line x1="900" y1="522" x2="660" y2="522" stroke="#8B1A1A" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#ah_red)"/><text x="780.0" y="503" font-size="10.8" fill="#8B1A1A" font-weight="bold" text-anchor="middle">握手失败 / 超时 / 服务未启动 →</text><text x="780.0" y="516" font-size="10.8" fill="#8B1A1A" font-weight="bold" text-anchor="middle">[warn] 回退进程内驱动，用例照常执行</text><line x1="48" y1="544" x2="1552" y2="544" stroke="#D9D6CD" stroke-width="1.0"/><text x="48" y="559" font-size="11.5" fill="#1B5EA8" font-weight="bold">阶段 C · 用例执行（设备动作经 DM 转发）</text><path d="M 660,569 L 706,569 L 706,593 L 666,593" fill="none" stroke="#1F3F66" stroke-width="1.4" marker-end="url(#ah_blue)"/><text x="714" y="577" font-size="10.8" fill="#1F3F66" font-weight="bold">ctx.driver("dmm")</text><text x="714" y="592" font-size="10.8" fill="#1F3F66" font-weight="bold">.do("measure_dc_voltage")</text><line x1="900" y1="610" x2="1140" y2="610" stroke="#1F3F66" stroke-width="1.4" marker-end="url(#ah_blue)"/><text x="1020.0" y="591" font-size="10.8" fill="#1F3F66" font-weight="bold" text-anchor="middle">call(handle,</text><text x="1020.0" y="604" font-size="10.8" fill="#1F3F66" font-weight="bold" text-anchor="middle">action, params)，超时 2000 ms</text><line x1="1140" y1="640" x2="1400" y2="640" stroke="#1F3F66" stroke-width="1.4" marker-end="url(#ah_blue)"/><text x="1270.0" y="633" font-size="10.8" fill="#1F3F66" font-weight="bold" text-anchor="middle">driver.do(action, **params)</text><line x1="1400" y1="670" x2="1140" y2="670" stroke="#4A4A46" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#ah_gray)"/><text x="1270.0" y="663" font-size="10.8" fill="#4A4A46" font-weight="bold" text-anchor="middle">{ok, value, detail, simulated}</text><line x1="1140" y1="700" x2="900" y2="700" stroke="#4A4A46" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#ah_gray)"/><text x="1020.0" y="681" font-size="10.8" fill="#4A4A46" font-